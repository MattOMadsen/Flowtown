<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flowtown – Draw roads, keep the city flowing</title>
  <meta name="description" content="Cozy browser traffic game. Draw roads to connect districts and prevent traffic jams. Works on mobile and desktop." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-stone-100 overflow-hidden select-none">
  <!-- Top UI -->
  <div id="ui" class="fixed top-0 left-0 right-0 z-20 pointer-events-none">
    <div class="flex items-center justify-between p-3 md:p-4 gap-2">
      <div class="pointer-events-auto">
        <h1 class="text-xl md:text-2xl font-bold text-stone-800 tracking-tight">Flowtown</h1>
        <p class="text-xs text-stone-500 hidden sm:block">Tegn veje – hold byen kørende</p>
      </div>

      <div class="flex flex-wrap gap-1.5 pointer-events-auto justify-end">
        <button id="btn-draw" class="px-2.5 py-1.5 bg-white/95 hover:bg-white rounded-lg shadow text-xs sm:text-sm font-medium text-stone-700 border border-stone-200 active:scale-95 transition">
          Tegn
        </button>
        <button id="btn-erase" class="px-2.5 py-1.5 bg-white/95 hover:bg-white rounded-lg shadow text-xs sm:text-sm font-medium text-stone-700 border border-stone-200 active:scale-95 transition">
          Slet
        </button>
        <button id="btn-undo" class="px-2.5 py-1.5 bg-white/95 hover:bg-white rounded-lg shadow text-xs sm:text-sm font-medium text-stone-700 border border-stone-200 active:scale-95 transition">
          Undo
        </button>
        <button id="btn-clear" class="px-2.5 py-1.5 bg-white/95 hover:bg-white rounded-lg shadow text-xs sm:text-sm font-medium text-stone-700 border border-stone-200 active:scale-95 transition">
          Clear
        </button>
        <button id="btn-toggle" class="px-2.5 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg shadow text-xs sm:text-sm font-medium active:scale-95 transition">
          Pause
        </button>
      </div>
    </div>
  </div>

  <!-- Goal progress -->
  <div class="fixed top-16 left-1/2 -translate-x-1/2 z-20 pointer-events-none w-48 sm:w-64">
    <div class="bg-white/90 backdrop-blur rounded-full h-2.5 shadow border border-stone-200 overflow-hidden">
      <div id="goal-bar" class="bg-emerald-500 h-full transition-all duration-300 rounded-full" style="width: 0%"></div>
    </div>
    <div class="text-center text-xs text-stone-600 mt-1 font-medium">
      Mål: <span id="goal-count">20</span>
    </div>
  </div>

  <!-- Stats -->
  <div id="stats" class="fixed bottom-4 left-4 right-4 z-20 pointer-events-none">
    <div class="bg-white/90 backdrop-blur rounded-xl px-3 py-2 shadow border border-stone-200 text-xs sm:text-sm text-stone-700 flex flex-wrap gap-x-2 gap-y-1 justify-center sm:justify-start">
      <span><span id="car-count">0</span> biler</span>
      <span>·</span>
      <span><span id="road-count">0</span> veje</span>
      <span>·</span>
      <span><span id="arrived-count">0</span> ankommet</span>
      <span>·</span>
      <span>session <span id="best-count">0</span></span>
      <span>·</span>
      <span>rekord <span id="alltime-count">0</span></span>
      <span>·</span>
      <span>flow <span id="flow-pct">0%</span></span>
    </div>
  </div>

  <!-- Help overlay -->
  <div id="help" class="fixed inset-0 z-30 bg-black/40 flex items-center justify-center p-6 pointer-events-auto">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl text-center">
      <h2 class="text-xl font-bold text-stone-800 mb-2">Velkommen til Flowtown</h2>
      <p class="text-stone-600 text-sm mb-4 leading-relaxed text-left space-y-1.5">
        <span class="block">• <b>Tegn</b> veje (endepunkter snapper automatisk)</span>
        <span class="block">• <b>Slet</b>: tryk på en vej for at fjerne den</span>
        <span class="block">• Nå målene for at stige i niveau</span>
        <span class="block">• Rekorden gemmes automatisk</span>
      </p>
      <button id="btn-start" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-xl active:scale-95 transition">
        Start med at tegne
      </button>
    </div>
  </div>

  <canvas id="game" class="block w-full h-full touch-none"></canvas>

  <script type="module" src="js/main.js"></script>
</body>
</html>
